# ----------------------------------------------------------------------------------#
# Description: OTIO Stack for Coozila! Studio v4.2
# Services: otio-engine (Backend), otioview (Visualizer)
# ----------------------------------------------------------------------------------#

version: '3.8'

services:
  # 🚂 OTIO ENGINE (The State Machine API)
  # Acts as the headless processor for OTIO files in S3
  otio-engine:
    container_name: otio-engine
    build:
      context: ./apps/otio
      dockerfile: Dockerfile
    image: coozila/otio-engine:v4.2
    restart: always
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - OTIO_DEFAULT_FPS=${OTIO_DEFAULT_FPS:-24}
    networks:
      - coozila-net
    volumes:
      - ./data/blueprints:/app/blueprints

  # 👁️ OTIOVIEW (The Timeline Visualizer)
  # Provides the visual feedback for the current state of the "Box"
  otioview:
    container_name: otioview-service
    build:
      context: ./apps/otioview
      dockerfile: Dockerfile
    image: coozila/otioview:v4.2
    restart: always
    ports:
      - "8082:8080" # Exposed for Canvas UI Integration
    environment:
      - OTIO_ENGINE_URL=http://otio-engine:8000
      - STORAGE_URL=${S3_ENDPOINT}
    networks:
      - coozila-net
    depends_on:
      - otio-engine

networks:
  coozila-net:
    external: true