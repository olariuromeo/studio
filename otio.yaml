# Document: dev/otio.yaml
# Description: OTIO Stack for Coozila! Studio v4.2
# Services: otio-engine (Backend), otioview (Visualizer)
# ----------------------------------------------------------------------------------#
version: '3.8'

networks:
  kabballa_private_network:
    external: true

services:
  otio-engine:
    image: ghcr.io/kabballa/otio-engine:v4.2
    restart: always
    env_file:
      - ../.env.dev
    environment:
      - OTIO_DEFAULT_FPS=${OTIO_DEFAULT_FPS:-24}
      - OTIO_NETWORK=${OTIO_NETWORK:-otio_private_network}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_PRODUCTION=${S3_BUCKET_PRODUCTION}
    networks:
      - kabballa_private_network
    volumes:
      - ./data/blueprints:/app/blueprints

  otioview:
    image: ghcr.io/kabballa/otioview:v4.2
    container_name: otioview-service
    restart: always
    ports:
      - "8082:8080"
    env_file:
      - ../.env.dev
    environment:
      - OTIO_ENGINE_URL=http://otio-engine:8000
      - STORAGE_URL=${S3_ENDPOINT}
    networks:
      - kabballa_private_network
    depends_on:
      - otio-engine