# Description: Modular Gateway Orchestration for Coozila! Studio v4.2
# Service: mcp-proxy (The Control Plane Router)
# ----------------------------------------------------------------------------------#

version: '3.8'

services:
  mcp-proxy:
    IMAGE: mcp/pluggedin-mcp-proxy:Latest
    #Image: coozila/mcp-proxy:v4.2
    container_name: mcp-proxy-gateway
    build:
      context: ./apps/mcp-proxy
      dockerfile: Dockerfile
    image: coozila/mcp-proxy:v4.2
    restart: always
    ports:
      - "${MCP_PROXY_PORT:-8000}:8000"
    env_file:
      - .env.dev
    environment:
      # Control Plane Routing
      - STUDIO_PROVIDER_URL=${MCP_STUDIO_HOST}
      - SEARCH_PROVIDER_URL=${MCP_SEARCH_HOST}
      
      # Data Plane Integration (The "Box" Logic)
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - BUCKET_NAME=${S3_BUCKET_PRODUCTION}
      
      # Security & Validation
      - API_KEY=${MCP_PROXY_API_KEY}
      - FORCE_64N=${FORCE_64N_ALIGNMENT}
      - DEBUG=${DEBUG}
    
    networks:
      - coozila-net
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

networks:
  coozila-net:
    external: true