# Document: dev/otio.yaml
# Description: OTIO Stack for Coozila! Studio v4.2
# Services: otio-engine (Backend), otioview (Visualizer)
# ----------------------------------------------------------------------------------#
version: '3.8'

#   STACK NETWORK    ---------------------------------------------------------------#


networks:                                                                           #

  #   Private network for application services    ----------------------------------#

  kabballa_private_network:
    #
    #   SSH command to create the Docker network: 
    #   docker network create --driver bridge kabballa_private_network --subnet=172.16.0.0/16
    #

    external: true

  #   Private network for mcrouter services    -------------------------------------#

# ----------------------------------------------------------------------------------#

#   STACK SERVICES    --------------------------------------------------------------#

services:

  # --------------------------------------------------------------------------------#

  #   OTIO ENGINE    ---------------------------------------------------------------#

  otio-engine:
    container_name: otio-engine
    build:
      context: ./apps/otio
      dockerfile: Dockerfile
    image: coozila/otio-engine:v4.2
    restart: always
    environment:
      #
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - OTIO_DEFAULT_FPS=${OTIO_DEFAULT_FPS:-24}
      #
    volumes:
      #
      - ./data/blueprints:/app/blueprints
      #
    extra_hosts:
      #
      - "host.docker.internal:host-gateway"
      - "${LOCAL_LISTEN_ADDR:-127.0.0.1}:host-gateway"
      - "${OTIO_HOSTNAME:-otio}:${LOCAL_LISTEN_ADDR:-127.0.0.1}"
      #
    networks:
      - ${OTIO_NETWORK:-otio_private_network}

# ----------------------------------------------------------------------------------#

#   OTIOVIEW SERVICES    --------------------------------------------------------------#

  otioview:
    container_name: otioview-service
    build:
      context: ./apps/otioview
      dockerfile: Dockerfile
    image: coozila/otioview:v4.2
    restart: always
    ports:
      - "8082:8080" # Exposed for Canvas UI Integration
    environment:
      - OTIO_ENGINE_URL=http://otio-engine:8000
      - STORAGE_URL=${S3_ENDPOINT}
    networks:
      - kabballa_private_network
    depends_on:
      - otio-engine

# ----------------------------------------------------------------------------------#